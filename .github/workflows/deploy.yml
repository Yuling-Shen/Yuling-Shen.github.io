name: Deploy academic homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Run unit tests
        run: npm run test:unit
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Verify root Pages output
        run: npm run build && npx vitest run tests/site/homepage.test.ts
        env:
          SITE_URL: https://example.github.io
          BASE_PATH: "/"
      - name: Verify project Pages output
        run: npm run build && npx vitest run tests/site/homepage.test.ts
        env:
          SITE_URL: https://example.github.io
          BASE_PATH: "/academic-homepage"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build production Pages artifact
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
